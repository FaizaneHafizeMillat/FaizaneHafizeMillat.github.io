<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مضمون پیج</title>

    <!-- گوگل سے خوبصورت اردو نستعلیق فونٹ -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* ویب سائٹ کا مین ڈیزائن */
        body {
            background-color: #121212; /* گہرا ڈارک بیک گراؤنڈ */
            color: #ffffff;            /* سفید متن (Text Color) */
            font-family: 'Noto Nastaliq Urdu', serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        /* مواد کو درمیانی حد میں رکھنے کے لیے */
        .container {
            width: 100%;
            max-width: 800px; /* کمپیوٹر پر زیادہ سے زیادہ چوڑائی */
        }

        /* اردو متن (Text) کی سیٹنگ */
        .urdu-text {
            /* 🔴 فونٹ سائز بدلنے کے لیے نیچے 22px کو کم یا زیادہ کریں */
            font-size: 22px; 
            
            /* 🔴 فونٹ کا رنگ بدلنے کے لیے نیچے #ffffff کو تبدیل کریں */
            color: #ffffff; 
            
            text-align: center;
            line-height: 2.2;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        /* تصویروں کو موبائل ریسپانسیو اور فل وڈتھ بنانے کے لیے */
        .full-img {
            width: 100%;       /* پیج کی پوری چوڑائی */
            height: auto;      /* تصویر کی لمبائی خود بخود ایڈجسٹ ہوگی */
            display: block;
            margin-bottom: 15px; /* تصویروں کے درمیان فاصلہ */
            border-radius: 5px; /* ہلکے سے گول کونے (اگر نہ چاہیں تو یہ لائن ہٹا دیں) */
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 1. سب سے اوپر اردو کی 1 یا 2 لائنیں -->
        <div class="urdu-text">
            مفتیِ مرکزی دارالافتاء (بریلی شریف) حضرت مولانا مفتی بلال انور صاحب قبلہ کا فتویٰ۔
        </div>

        <!-- 2. پہلی تصویر -->
        <!-- 🔴 src=" " کے اندر اپنی تصویر کا نام یا لنک لکھیں -->
        <img src="Fatwa-0.jpg" alt="تصویر 1" class="full-img">

        <!-- 3. تصویر کے نیچے اردو میں ایک لائن -->
        <div class="urdu-text">
             مفتی ابرار احمد امجدی مرکز تربیت افتاء (اوجھا گنج، بستی) کا فتویٰ ۔
        </div>

        <!-- 4. اس کے بعد 3 تصویریں ایک کے نیچے ایک -->
        <img src="Fatwa-1.jpg" alt="تصویر 2" class="full-img">
        <img src="Fatwa-2.jpg" alt="تصویر 3" class="full-img">
        <img src="Fatwa-3.jpg" alt="تصویر 4" class="full-img">

    </div>

</body>
</html>
